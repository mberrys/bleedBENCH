[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "bleedbench"
version = "2.1.0.dev0"
description = "Reference harness for bleedBENCH: generative bleed extension in print production"
license = { text = "Apache-2.0" }
requires-python = ">=3.11"
dependencies = [
    "pymupdf>=1.24",
    "numpy>=1.26",
    "pillow>=10",
    "opencv-python-headless>=4.9",
    "scipy>=1.11",
    "scikit-image>=0.22",
    "imagehash>=4.3",
]

[project.optional-dependencies]
ml = ["torch>=2.3", "safetensors>=0.4", "scikit-learn>=1.4"]
dev = ["pytest>=8"]

[project.scripts]
bleedbench = "bleedbench.__main__:main"

[tool.setuptools.packages.find]
include = ["bleedbench*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["private: needs the local private corpus (_corpus/) and salt"]
addopts = "-m 'not private'"
